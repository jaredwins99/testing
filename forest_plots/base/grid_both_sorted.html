<!doctype html>
<html><head><meta charset="utf-8"><title>2x6 both-tier grid</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:4px;width:100vw;height:100vh}
.cell{position:relative;overflow:hidden;border:1px solid #ccc;cursor:zoom-in}
.cell iframe{width:100%;height:100%;border:0;pointer-events:none}
.cell.expanded{position:fixed;inset:0;z-index:9999;background:#fff;cursor:zoom-out}
.cell.expanded iframe{pointer-events:auto}
.cell.dimmed{opacity:0.15}
.missing{display:flex;align-items:center;justify-content:center;color:#999;border:1px dashed #ccc}
.hint{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;pointer-events:none}
</style></head><body><div class="grid" id="g">
<div class="cell" title="T1 A1 — click to expand"><iframe src="t1_sorted/A1_proportion_forest_restaurants.html"></iframe><span class="hint">T1 A1</span></div>
<div class="cell" title="T1 A2 — click to expand"><iframe src="t1_sorted/A2_proportion_targeted_forest_restaurants.html"></iframe><span class="hint">T1 A2</span></div>
<div class="cell" title="T1 A3 — click to expand"><iframe src="t1_sorted/A3_its_forest_restaurants.html"></iframe><span class="hint">T1 A3</span></div>
<div class="cell" title="T1 A4 — click to expand"><iframe src="t1_sorted/A4_its_targeted_forest_restaurants.html"></iframe><span class="hint">T1 A4</span></div>
<div class="cell" title="T1 A5 — click to expand"><iframe src="t1_sorted/A5_gaussian_iid_day_forest_restaurants.html"></iframe><span class="hint">T1 A5</span></div>
<div class="cell" title="T1 A6 — click to expand"><iframe src="t1_sorted/A6_gaussian_iid_day_targeted_forest_restaurants.html"></iframe><span class="hint">T1 A6</span></div>
<div class="cell" title="T2 A1 — click to expand"><iframe src="t2_sorted/A1_proportion_forest_restaurants.html"></iframe><span class="hint">T2 A1</span></div>
<div class="cell" title="T2 A2 — click to expand"><iframe src="t2_sorted/A2_proportion_targeted_forest_restaurants.html"></iframe><span class="hint">T2 A2</span></div>
<div class="cell" title="T2 A3 — click to expand"><iframe src="t2_sorted/A3_its_forest_restaurants.html"></iframe><span class="hint">T2 A3</span></div>
<div class="cell" title="T2 A4 — click to expand"><iframe src="t2_sorted/A4_its_targeted_forest_restaurants.html"></iframe><span class="hint">T2 A4</span></div>
<div class="cell" title="T2 A5 — click to expand"><iframe src="t2_sorted/A5_gaussian_iid_day_forest_restaurants.html"></iframe><span class="hint">T2 A5</span></div>
<div class="cell" title="T2 A6 — click to expand"><iframe src="t2_sorted/A6_gaussian_iid_day_targeted_forest_restaurants.html"></iframe><span class="hint">T2 A6</span></div>
</div>
<script>
document.querySelectorAll('#g .cell').forEach(c=>{
  c.addEventListener('click',()=>{
    const e=c.classList.toggle('expanded');
    document.querySelectorAll('#g .cell').forEach(o=>{if(o!==c)o.classList.toggle('dimmed',e)});
  });
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('#g .cell.expanded').forEach(c=>c.click())}});
</script>
</body></html>
